  - Guide and mentor colleagues through technical onboarding and partner enablement. Previously served as the
    primary technical lead for Brazil, supporting LATAM engagements in Portuguese and Spanish. Also supported
    US accounts during part of that time, while based in Brazil.
  - Delivered product demonstrations and customer technical discussions at Scandit's exhibitor booth at NRF
